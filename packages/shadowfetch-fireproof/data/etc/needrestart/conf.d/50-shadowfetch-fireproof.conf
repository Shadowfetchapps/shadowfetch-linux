# Shadowfetch Fireproof: needrestart never restarts fireproofd.
#
# needrestart runs as apt's DPkg::Post-Invoke hook, and when the update was
# started from Fireproof (`fireproof update`, the Fireproof page) apt and that
# hook are fireproofd's own children. shadowfetch-defaults sets
# $nrconf{restart} = 'a', so without this line needrestart would run
# `systemctl restart fireproofd.service` from inside fireproofd's transaction:
# the restart waits for the daemon to stop, the daemon defers its stop until
# its transaction finishes, and the transaction is waiting for the restart.
# QA 5.0.1 saw exactly that hang until TimeoutStopSec (one hour), holding the
# dpkg lock and a shutdown inhibitor the whole time.
#
# fireproofd is restarted on a schedule that cannot deadlock instead:
#   * fireproofd exits by itself after every successful commit, so the next
#     D-Bus activation runs the code and libraries now on disk;
#   * when shadowfetch-fireproof itself is upgraded, its postinst restarts an
#     idle daemon, or defers the restart until the daemon running the upgrade
#     has finished (/usr/libexec/fireproof-restart-after-upgrade).
# An update made with apt that touches only libraries leaves an idle daemon on
# the old libraries until its next commit or the next boot; needrestart lists
# it under "Service restarts being deferred".
$nrconf{override_rc}{qr(^fireproofd\.service$)} = 0;
