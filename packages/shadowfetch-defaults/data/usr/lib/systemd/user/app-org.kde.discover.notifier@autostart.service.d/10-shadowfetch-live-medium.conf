# Shadowfetch: no update notifier on the live medium.
#
# KDE's update notifier (autostart entry org.kde.discover.notifier.desktop,
# run by systemd-xdg-autostart-generator as this unit) asks PackageKit to
# refresh the apt indexes 300 s after login. The ISO ships without them, so on
# a live session the refresh downloads all of them and writes them into the
# RAM-backed overlay: about 350 MB of memory gone for the rest of the session,
# for updates a live session could not keep anyway.
#
# /run/live/medium and /run/live/rootfs exist only when running from the ISO,
# so installed and upgraded systems still start the notifier and keep their
# update notifications. Same test as shadowfetch-gpu-detect.service
# (live-build hook 0020).
[Unit]
ConditionPathExists=!/run/live/medium
ConditionPathExists=!/run/live/rootfs
