GRUB_THEME=/usr/share/grub/themes/umbra/theme.txt
GRUB_GFXMODE=1024x768,auto
# The theme draws only the menu. Once an entry is chosen ("Loading Linux ...")
# and whenever the theme cannot be read (e.g. an encrypted root), GRUB shows the
# gfxterm background_image, which /etc/grub.d/05_debian_theme takes from
# desktop-base (Debian blue) unless GRUB_BACKGROUND is set. 05_debian_theme
# copies this image into /boot/grub when / is another filesystem, so it stays
# readable with the separate /boot the installer creates.
GRUB_BACKGROUND=/usr/share/grub/themes/umbra/background.png
